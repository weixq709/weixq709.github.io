tag vp-tag-flmc" href="/blog/tags/?tag=springboot" data-v-821a1f7d><!--[-->springboot<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-ej7d" href="/blog/tags/?tag=SpEL" data-v-821a1f7d><!--[-->SpEL<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2025-08-17</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>在面向切面编程（AOP）中，我们经常需要自定义切面来拦截方法来实现一些自定义操作，例如：记录操作日志。切面注解的属性值可能需要从方法调用的上下文（如方法参数、返回值、Session属性等）中动态获取。本文将利用SpEl自定义上下文，实现运行时在切面中支持使用SpEL表达式动态解析参数值。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/dubbo/soure-code-constraction/" data-v-821a1f7d><!--[-->源码构建<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><div class="category-list" data-v-821a1f7d><span class="icon vpi-folder" data-v-821a1f7d></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=4358b5" data-v-821a1f7d><!--[-->notes<!--]--><!--[--><!--]--><!----></a><span data-v-821a1f7d>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=ead2bc" data-v-821a1f7d><!--[-->dubbo<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 243 字</span><span data-v-821a1f7d>1 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2025-08-03</span></div></div><!----></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/article/be2kfu0e/" data-v-821a1f7d><!--[-->调用链抽象及节点支持自动注入<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><div class="category-list" data-v-821a1f7d><span class="icon vpi-folder" data-v-821a1f7d></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=e778d6" data-v-821a1f7d><!--[-->后端<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 472 字</span><span data-v-821a1f7d>2 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2025-02-08</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>大部分系统中，可能都会用到调用链模式，并且同时存在多个调用链。我们希望在使用时，可以自动完成调用链路的构建以及支持自动注入，从而减少代码的冗余，提高开发效率。本文将说明如何利用<code v-pre>Spring</code>扩展点，实现调用链的抽象及节点自动注入。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-ea564199 data-v-821a1f7d><!----><div class="post-item-content" data-v-821a1f7d><h3 data-v-821a1f7d><!----><!----><!----><a class="vp-link link" href="/article/g8747vh2/" data-v-821a1f7d><!--[-->spring异步切面支持<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-821a1f7d><div class="category-list" data-v-821a1f7d><span class="icon vpi-folder" data-v-821a1f7d></span><!--[--><!--[--><a class="vp-link link no-icon" href="/blog/categories/?id=e778d6" data-v-821a1f7d><!--[-->后端<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-821a1f7d><span class="vpi-books icon" data-v-821a1f7d></span><span data-v-821a1f7d>约 454 字</span><span data-v-821a1f7d>2 分钟</span></div><!----><div class="create-time" data-v-821a1f7d><span class="icon vpi-clock" data-v-821a1f7d></span><span data-v-821a1f7d>2025-01-20</span></div></div><div class="vp-doc excerpt" data-v-821a1f7d><p>某些场景下，我们希望异步执行业务方法，比如发送短信、邮件等，避免阻塞主线程，提高系统的吞吐量。本文将介绍，如何自定义注解实现类似<code v-pre>@Async</code>的功能，并解决异步切面中无法使用除环绕通知的其他通知类型的问题。</p>
